<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Ghép Ảnh 2130x1806 - Tỷ Lệ Chuẩn</title>
    <style>
        :root {
            --bg-color: #0f172a; --panel-bg: #1e293b; --border-color: #334155;
            --accent-color: #3b82f6; --text-main: #f8fafc; --gold: #d4af37;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color);
            color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden;
        }
        .sidebar-left {
            width: 300px; background-color: var(--panel-bg); border-right: 1px solid var(--border-color);
            padding: 24px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0;
        }
        .sidebar-right {
            width: 320px; background-color: var(--panel-bg); border-left: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; gap: 15px; flex-shrink: 0;
        }
        .workspace {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); overflow: hidden;
        }
        #collage-wrapper { transform-origin: center center; }
        #collage-container {
            width: 2130px; height: 1806px; background-color: #1a2042;
            display: flex; flex-direction: column; padding: var(--pad); gap: var(--gap);
        }
        .banners-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); height: var(--bannerH); flex-shrink: 0; }
        .grid-row { display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); gap: var(--gap); flex-grow: 1; }
        .slot {
            background-color: #0f172a; border: 3px solid #475569; position: relative;
            background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center;
        }
        .slot-text { color: rgba(255,255,255,0.4); font-size: 24px; font-weight: bold; pointer-events: none; }
        .gallery { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .gallery-item { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: grab; background: #000; }
        .search-box { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: white; margin-bottom: 10px; }
        button { padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: white; cursor: pointer; text-align: left; }
        button.active { background: var(--accent-color); border-color: var(--accent-color); }
        .btn-success { background: #10b981; text-align: center; font-weight: bold; margin-top: auto; border: none; }
        .slot.drag-over { border-color: #10b981; background-color: rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>

    <div class="sidebar-left">
        <h1>Cấu Hình Layout</h1>
        <button class="tpl-btn active" data-id="t17">Mẫu 17 Tướng</button>
        <button class="tpl-btn" data-id="t45">Mẫu 45 Tướng</button>
        <button class="tpl-btn" data-id="t100">Mẫu 100 Tướng</button>
        <button id="downloadBtn" class="btn-success">⬇️ Xuất Ảnh Báo Cáo</button>
    </div>

    <div class="workspace">
        <div id="collage-wrapper">
            <div id="collage-container">
                <div class="banners-row" id="banners-container"></div>
                <div class="grid-row" id="champs-container"></div>
            </div>
        </div>
    </div>

    <div class="sidebar-right">
        <h2>KHO ẢNH</h2>
        <input type="text" id="searchInput" class="search-box" placeholder="Tìm tướng...">
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const container = document.getElementById('collage-container');
        const bannersContainer = document.getElementById('banners-container');
        const champsContainer = document.getElementById('champs-container');
        const wrapper = document.getElementById('collage-wrapper');
        const gallery = document.getElementById('gallery');
        const imageMap = new Map();

        // 1. Cấu hình tướng (Sửa tại đây)
        const CONFIG = {
            baseDir: "images",
            heroes: [
                { id: "sines", name: "Sinestrea", count: 15 },
                { id: "nak", name: "Nakroth", count: 20 },
                { id: "val", name: "Valhein", count: 12 }
            ]
        };

        const templates = {
            't17': { cols: 7, rows: 3, statsCols: 4, statsRows: 1, gap: 24, pad: 30, bannerH: 260 },
            't45': { cols: 10, rows: 5, statsCols: 5, statsRows: 1, gap: 16, pad: 25, bannerH: 260 },
            't100': { cols: 14, rows: 8, statsCols: 6, statsRows: 2, gap: 6, pad: 20, bannerH: 260 }
        };

        // 2. Load Gallery
        function loadDatabaseSkins() {
            gallery.innerHTML = '';
            CONFIG.heroes.forEach(hero => {
                for (let i = 1; i <= hero.count; i++) {
                    const img = document.createElement('img');
                    const src = `${CONFIG.baseDir}/${hero.id}/${i}.png`;
                    img.src = src;
                    img.crossOrigin = "anonymous";
                    img.className = 'gallery-item';
                    img.dataset.name = `${hero.name} ${i}`.toLowerCase();
                    img.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', src));
                    img.onerror = () => img.remove();
                    gallery.appendChild(img);
                }
            });
        }

        // 3. Xử lý Layout
        function buildLayout(templateId) {
            const cfg = templates[templateId];
            container.style.setProperty('--cols', cfg.cols);
            container.style.setProperty('--rows', cfg.rows);
            container.style.setProperty('--gap', cfg.gap + 'px');
            container.style.setProperty('--pad', cfg.pad + 'px');
            container.style.setProperty('--bannerH', cfg.bannerH + 'px');

            bannersContainer.innerHTML = ''; champsContainer.innerHTML = ''; imageMap.clear();

            for(let i=0; i<3; i++) {
                bannersContainer.innerHTML += `<div class="slot" data-id="banner_${i}"><span class="slot-text">Banner</span></div>`;
            }

            const totalArea = cfg.cols * cfg.rows;
            const statsArea = cfg.statsCols * cfg.statsRows;
            const statsIndexTrigger = Math.floor((cfg.rows - cfg.statsRows) / 2) * cfg.cols;

            let currentArea = 0, champCount = 0;
            let champsHTML = '';
            while (currentArea < totalArea) {
                if (currentArea === statsIndexTrigger) {
                    champsHTML += `<div class="slot" data-id="stats" style="grid-column: span ${cfg.statsCols}; grid-row: span ${cfg.statsRows}; border-style: dashed;"><span class="slot-text">Thông Số</span></div>`;
                    currentArea += statsArea;
                } else {
                    champsHTML += `<div class="slot" data-id="champ_${champCount}"><span class="slot-text">+</span></div>`;
                    champCount++; currentArea++;
                }
            }
            champsContainer.innerHTML = champsHTML;
            attachSlotEvents();
            adjustScale();
        }

        function attachSlotEvents() {
            document.querySelectorAll('.slot').forEach(slot => {
                slot.ondragover = e => { e.preventDefault(); slot.classList.add('drag-over'); };
                slot.ondragleave = () => slot.classList.remove('drag-over');
                slot.ondrop = e => {
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    const src = e.dataTransfer.getData('text/plain');
                    if (src) {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.onload = () => {
                            slot.style.backgroundImage = `url(${src})`;
                            imageMap.set(slot.dataset.id, img);
                        };
                        img.src = src;
                    }
                };
            });
        }

        function adjustScale() {
            const scale = Math.min((window.innerWidth - 650) / 2130, (window.innerHeight - 60) / 1806, 1);
            wrapper.style.transform = `scale(${scale})`;
        }

        // 4. Xuất ảnh
        document.getElementById('downloadBtn').onclick = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 2130; canvas.height = 1806;
            ctx.fillStyle = '#1a2042'; ctx.fillRect(0, 0, 2130, 1806);

            document.querySelectorAll('.slot').forEach(slot => {
                const rect = slot.getBoundingClientRect();
                const contRect = container.getBoundingClientRect();
                const scale = 2130 / contRect.width;
                const x = (rect.left - contRect.left) * scale;
                const y = (rect.top - contRect.top) * scale;
                const w = rect.width * scale;
                const h = rect.height * scale;

                ctx.fillStyle = '#0f172a'; ctx.fillRect(x, y, w, h);
                if (imageMap.has(slot.dataset.id)) {
                    const img = imageMap.get(slot.dataset.id);
                    const s = Math.max(w / img.width, h / img.height);
                    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
                    ctx.drawImage(img, x + (w - img.width * s) / 2, y + (h - img.height * s) / 2, img.width * s, img.height * s);
                    ctx.restore();
                }
                ctx.strokeStyle = '#475569'; ctx.lineWidth = 4; ctx.strokeRect(x, y, w, h);
            });
            const link = document.createElement('a');
            link.download = 'Lien-Quan-Studio.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        document.querySelectorAll('.tpl-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                buildLayout(btn.dataset.id);
            };
        });

        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.gallery-item').forEach(img => {
                img.style.display = img.dataset.name.includes(val) ? 'block' : 'none';
            });
        };

        window.onresize = adjustScale;
        loadDatabaseSkins();
        buildLayout('t17');
    </script>
</body>
</html>
