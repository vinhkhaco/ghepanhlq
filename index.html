<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tool Cắt Skin Liên Quân chuyên nghiệp</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 30px; }
        .card { background: #16213e; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 900px; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-bottom: 20px; background: #0f3460; padding: 15px; border-radius: 8px; }
        label { display: block; font-size: 12px; color: #add8e6; margin-bottom: 5px; }
        input[type="number"] { width: 100%; padding: 8px; border-radius: 4px; border: none; background: #fff; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; cursor: pointer; padding: 12px; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        #btn-crop { background: var(--primary); color: white; }
        #btn-download { background: var(--success); color: white; display: none; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .display-area { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; justify-content: center; }
        .canvas-container { position: relative; border: 2px dashed #4e4e6a; }
        canvas { max-width: 100%; height: auto; display: block; }
        .result-box { text-align: center; }
        #cropCanvas { border: 3px solid var(--success); border-radius: 8px; margin-top: 10px; }
        h2 { margin-top: 0; color: #e94560; }
    </style>
</head>
<body>

<div class="card">
    <h2>Cắt Ảnh Skin Sinestrea</h2>
    
    <div class="controls">
        <div style="grid-column: span 2;">
            <label>Chọn file ảnh gốc:</label>
            <input type="file" id="upload" accept="image/*" style="color: white;">
        </div>
        <div><label>Tọa độ X:</label><input type="number" id="x" value="65"></div>
        <div><label>Tọa độ Y:</label><input type="number" id="y" value="315"></div>
        <div><label>Chiều rộng:</label><input type="number" id="w" value="130"></div>
        <div><label>Chiều cao:</label><input type="number" id="h" value="225"></div>
    </div>

    <div class="btn-group">
        <button id="btn-crop" onclick="previewCrop()">1. Xem trước vùng cắt</button>
        <button id="btn-download" onclick="downloadImage()">2. Tải ảnh về máy</button>
    </div>

    <div class="display-area">
        <div class="result-box">
            <p>Ảnh gốc (Preview)</p>
            <div class="canvas-container">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>
        
        <div class="result-box" id="resultContainer" style="visibility: hidden;">
            <p>Kết quả cắt (Thực tế)</p>
            <canvas id="cropCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    const upload = document.getElementById('upload');
    const mainCanvas = document.getElementById('mainCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const btnDownload = document.getElementById('btn-download');
    const resultContainer = document.getElementById('resultContainer');
    let originalImg = new Image();

    upload.addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            originalImg.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    originalImg.onload = function() {
        const ctx = mainCanvas.getContext('2d');
        mainCanvas.width = originalImg.width;
        mainCanvas.height = originalImg.height;
        ctx.drawImage(originalImg, 0, 0);
        resultContainer.style.visibility = 'hidden';
        btnDownload.style.display = 'none';
    };

    function previewCrop() {
        if (!originalImg.src) return alert("Vui lòng chọn ảnh trước!");

        const x = parseInt(document.getElementById('x').value);
        const y = parseInt(document.getElementById('y').value);
        const w = parseInt(document.getElementById('w').value);
        const h = parseInt(document.getElementById('h').value);

        // 1. Vẽ lại ảnh gốc và vẽ khung đỏ đè lên để đánh dấu vùng cắt
        const mainCtx = mainCanvas.getContext('2d');
        mainCtx.drawImage(originalImg, 0, 0);
        mainCtx.strokeStyle = "red";
        mainCtx.lineWidth = 5;
        mainCtx.strokeRect(x, y, w, h);

        // 2. Thực hiện cắt lên canvas kết quả
        const cropCtx = cropCanvas.getContext('2d');
        cropCanvas.width = w;
        cropCanvas.height = h;
        cropCtx.drawImage(originalImg, x, y, w, h, 0, 0, w, h);

        // 3. Hiển thị kết quả và nút tải
        resultContainer.style.visibility = 'visible';
        btnDownload.style.display = 'block';
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'skin-lien-quan.png';
        link.href = cropCanvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
