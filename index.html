<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Studio Liên Quân Pro - Fixed Layout</title>
    <style>
        :root { 
            --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --gold: #d4af37; 
            --gap: 20px; /* Khoảng cách giữa các ô */
        }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* SIDEBARS */
        .sidebar-left { width: 260px; padding: 20px; background: var(--panel); border-right: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .sidebar-right { width: 340px; padding: 20px; background: var(--panel); border-left: 1px solid #334155; display: flex; flex-direction: column; z-index: 10; }

        /* WORKSPACE & CANVAS */
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        #wrapper { transform-origin: center; transition: transform 0.2s; }

        #collage-container { 
            width: 2130px; height: 1806px; 
            background: #1a2042; 
            display: flex; flex-direction: column; 
            padding: 40px; gap: var(--gap);
            box-sizing: border-box;
        }

        /* BANNER AREA */
        .banners-row { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: var(--gap); height: 320px; flex-shrink: 0; 
        }

        /* CHANNELS GRID AREA */
        #champs-grid { 
            display: grid; flex: 1; gap: var(--gap); 
            min-height: 0; /* Quan trọng để flex không bị tràn */
        }

        /* SLOTS STYLING */
        .slot { 
            background: #0f172a; border: 4px solid #475569; 
            background-size: cover; background-position: center; 
            display: flex; align-items: center; justify-content: center; 
            color: rgba(255,255,255,0.15); font-size: 32px; font-weight: bold;
            position: relative; transition: 0.2s;
        }
        .slot.has-img { border-color: var(--gold); background-color: #000; }
        .slot::after { content: attr(data-label); position: absolute; font-size: 14px; bottom: 5px; color: var(--gold); }

        /* GALLERY & UI */
        .gallery { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .gallery-item { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: grab; border-radius: 8px; border: 2px solid transparent; background: #000; }
        .gallery-item:hover { border-color: var(--accent); }
        .search-box { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; }
        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; background: #334155; text-align: left; }
        .btn.active { background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .btn-save { background: #10b981; text-align: center; margin-top: auto; padding: 15px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="sidebar-left">
        <h2 style="color: var(--gold); border-bottom: 1px solid #444; padding-bottom: 10px;">BỐ CỤC</h2>
        <button class="btn active" onclick="setLayout('t17', this)">Mẫu 17 Tướng (Chuẩn)</button>
        <button class="btn" onclick="setLayout('t45', this)">Mẫu 45 Tướng (Dày)</button>
        <button class="btn" onclick="setLayout('t100', this)">Mẫu 100 Tướng (Nhỏ)</button>
        <button class="btn btn-save" id="downloadBtn">XUẤT ẢNH PNG</button>
    </div>

    <div class="workspace">
        <div id="wrapper">
            <div id="collage-container">
                <div class="banners-row" id="banners"></div>
                <div id="champs-grid"></div>
            </div>
        </div>
    </div>

    <div class="sidebar-right">
        <h2 style="font-size: 18px;">KHO SKIN</h2>
        <input type="text" id="search" class="search-box" placeholder="Tìm tướng...">
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        // Cấu hình Database (Bạn sửa HEROES để khớp với GitHub của mình)
        const CONFIG = {
            baseDir: "images",
            heroes: [
                { id: "nak", name: "Nakroth", count: 13 },
                { id: "sines", name: "Sinestrea", count: 8 }
            ]
        };

        const imageMap = new Map();

        // 1. Hàm tạo Layout Sửa Lỗi Trình Bày
        function setLayout(type, btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const grid = document.getElementById('champs-grid');
            const banners = document.getElementById('banners');
            grid.innerHTML = ''; banners.innerHTML = ''; imageMap.clear();

            // Tạo 3 Banner chuẩn
            for(let i=1; i<=3; i++) {
                banners.innerHTML += `<div class="slot" data-id="b${i}" data-label="BANNER ${i}">+</div>`;
            }

            // Tính toán Grid theo mẫu
            let cols, rows, count;
            if(type === 't17') { 
                cols = 6; rows = 3; count = 17; // Bố cục thoáng
                grid.style.gap = "30px";
            } else if(type === 't45') { 
                cols = 9; rows = 5; count = 45; 
                grid.style.gap = "15px";
            } else { 
                cols = 13; rows = 8; count = 100; 
                grid.style.gap = "8px";
            }

            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            for(let i=1; i<=count; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.id = `c${i}`;
                slot.dataset.label = `Tướng ${i}`;
                slot.innerText = '+';
                
                // Kích hoạt kéo thả cho slot mới
                slot.ondragover = e => e.preventDefault();
                slot.ondrop = e => handleDrop(e, slot);
                
                grid.appendChild(slot);
            }
            adjustScale();
        }

        // 2. Xử lý ảnh kéo thả
        function handleDrop(e, slot) {
            e.preventDefault();
            const path = e.dataTransfer.getData('text');
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                slot.style.backgroundImage = `url("${path}")`;
                slot.innerText = '';
                slot.classList.add('has-img');
                imageMap.set(slot.dataset.id, img);
            };
            img.src = path;
        }

        // 3. Load Gallery (Tự động quét số 1.png, 2.png...)
        function loadGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            CONFIG.heroes.forEach(hero => {
                for(let i=1; i<=hero.count; i++) {
                    const img = document.createElement('img');
                    const src = `${CONFIG.baseDir}/${hero.id}/${i}.png`; // Giả định bạn đã đổi tên thành số
                    img.src = src;
                    img.className = 'gallery-item';
                    img.dataset.hero = hero.name.toLowerCase();
                    img.draggable = true;
                    img.crossOrigin = "anonymous";
                    img.addEventListener('dragstart', e => e.dataTransfer.setData('text', src));
                    img.onerror = () => img.remove();
                    gallery.appendChild(img);
                }
            });
        }

        // 4. Co giãn Workspace (Zoom-to-fit)
        function adjustScale() {
            const ws = document.querySelector('.workspace');
            const wrapper = document.getElementById('wrapper');
            const scale = Math.min((ws.clientWidth - 60) / 2130, (ws.clientHeight - 60) / 1806, 1);
            wrapper.style.transform = `scale(${scale})`;
        }

        window.onresize = adjustScale;
        loadGallery();
        setLayout('t17', document.querySelector('.btn.active'));
    </script>
</body>
</html>
