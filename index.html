<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tool Cắt Skin Liên Quân - Theo Thư Mục</title>
    <style>
        :root { --primary: #00d2ff; --accent: #e94560; --bg: #1a1a2e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #16213e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 95%; max-width: 1000px; }
        .path-info { background: #0f3460; padding: 10px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--primary); font-size: 14px; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; border-radius: 4px; border: none; outline: none; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; cursor: pointer; padding: 12px; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        #btn-preview { background: var(--primary); color: #000; }
        #btn-download { background: #28a745; color: white; display: none; }
        .workspace { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        canvas { max-width: 100%; border: 1px solid #444; background: #000; }
        .result-area { text-align: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; display: none; }
        #cropCanvas { border: 2px solid var(--primary); box-shadow: 0 0 15px var(--primary); }
    </style>
</head>
<body>

<div class="card">
    <h2>Cắt Ảnh Skin Tướng</h2>

    <div class="path-info">
        Cấu trúc nhận diện: <strong>Images / <span id="hero-display">Tên_Tướng</span> / [Ảnh_Bạn_Chọn]</strong>
    </div>
    
    <div class="controls">
        <div>
            <label>Tên tướng (Thư mục):</label><br>
            <input type="text" id="heroName" placeholder="Ví dụ: Sinestrea" oninput="updatePath()">
        </div>
        <div>
            <label>Chọn ảnh trong thư mục:</label><br>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div><label>X:</label><input type="number" id="x" value="65"></div>
        <div><label>Y:</label><input type="number" id="y" value="315"></div>
        <div><label>Rộng:</label><input type="number" id="w" value="130"></div>
        <div><label>Cao:</label><input type="number" id="h" value="225"></div>
    </div>

    <div class="btn-group">
        <button id="btn-preview" onclick="processCrop()">1. XEM TRƯỚC VÙNG CẮT</button>
        <button id="btn-download" onclick="downloadImage()">2. TẢI ẢNH RIÊNG</button>
    </div>

    <div class="workspace">
        <div style="text-align: center;">
            <p style="font-size: 12px; color: #888;">ẢNH GỐC (VÙNG ĐỎ SẼ ĐƯỢC CẮT)</p>
            <canvas id="mainCanvas"></canvas>
        </div>

        <div id="resultContainer" class="result-area">
            <p style="color: var(--primary); font-weight: bold;">KẾT QUẢ ĐOẠN SKIN:</p>
            <canvas id="cropCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    const upload = document.getElementById('upload');
    const mainCanvas = document.getElementById('mainCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const btnDownload = document.getElementById('btn-download');
    const resultContainer = document.getElementById('resultContainer');
    const heroDisplay = document.getElementById('hero-display');
    let originalImg = new Image();

    function updatePath() {
        heroDisplay.innerText = document.getElementById('heroName').value || "Tên_Tướng";
    }

    upload.addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            originalImg.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    originalImg.onload = function() {
        renderMain();
        resultContainer.style.display = 'none';
        btnDownload.style.display = 'none';
    };

    function renderMain() {
        const ctx = mainCanvas.getContext('2d');
        mainCanvas.width = originalImg.width;
        mainCanvas.height = originalImg.height;
        ctx.drawImage(originalImg, 0, 0);
    }

    function processCrop() {
        if (!originalImg.src) return alert("Bạn chưa chọn ảnh!");

        const x = parseInt(document.getElementById('x').value);
        const y = parseInt(document.getElementById('y').value);
        const w = parseInt(document.getElementById('w').value);
        const h = parseInt(document.getElementById('h').value);

        // Vẽ lại ảnh gốc và khung đỏ
        renderMain();
        const mainCtx = mainCanvas.getContext('2d');
        mainCtx.strokeStyle = "#ff0000";
        mainCtx.lineWidth = 8;
        mainCtx.strokeRect(x, y, w, h);

        // Cắt ảnh
        const cropCtx = cropCanvas.getContext('2d');
        cropCanvas.width = w;
        cropCanvas.height = h;
        cropCtx.drawImage(originalImg, x, y, w, h, 0, 0, w, h);

        // Hiện vùng kết quả
        resultContainer.style.display = 'block';
        btnDownload.style.display = 'block';
        
        // Cuộn xuống để xem kết quả
        resultContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function downloadImage() {
        const name = document.getElementById('heroName').value || ' tướng';
        const link = document.createElement('a');
        link.download = `Skin_${name}.png`;
        link.href = cropCanvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
