<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Studio Ghép Ảnh Liên Quân - Fix Kho Ảnh</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout chính */
        .sidebar-left { width: 300px; background: var(--card); padding: 20px; border-right: 1px solid #334155; overflow-y: auto; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        .sidebar-right { width: 300px; background: var(--card); padding: 20px; border-left: 1px solid #334155; display: flex; flex-direction: column; }

        /* Kho ảnh bên phải */
        .kho-anh-list { flex: 1; overflow-y: auto; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .thumb-item { width: 100%; aspect-ratio: 2/3; background: #000; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; object-fit: cover; }
        .thumb-item:hover { border-color: var(--primary); transform: scale(1.05); }

        /* Vùng cắt ảnh */
        canvas { max-width: 100%; background: #000; border-radius: 8px; margin-bottom: 10px; }
        input[type="number"] { width: 60px; padding: 5px; border-radius: 4px; border: none; }
        .btn { cursor: pointer; padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; margin: 5px 0; width: 100%; }
        .btn-preview { background: var(--primary); color: white; }
        .btn-download { background: #10b981; color: white; display: none; }

        /* Search bar */
        .search-box { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white; }
        h3 { font-size: 14px; color: #94a3b8; text-transform: uppercase; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="sidebar-left">
        <h3>Cấu hình Cắt Ảnh</h3>
        <input type="file" id="upload" accept="image/*" class="btn" style="background: #334155;">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;">
            <div><label>X</label><br><input type="number" id="x" value="65"></div>
            <div><label>Y</label><br><input type="number" id="y" value="315"></div>
            <div><label>Rộng</label><br><input type="number" id="w" value="130"></div>
            <div><label>Cao</label><br><input type="number" id="h" value="225"></div>
        </div>

        <button class="btn btn-preview" onclick="processCrop()">Xem trước & Cắt</button>
        <button id="btn-download" class="btn btn-download" onclick="downloadImage()">Tải Skin Riêng</button>
        
        <hr style="border: 0.5px solid #334155; margin: 20px 0;">
        <p style="font-size: 12px; color: #888;">* Chỉnh X, Y để di chuyển khung đỏ vào đúng vị trí thẻ skin.</p>
    </div>

    <div class="main-content">
        <h3>Preview Gốc</h3>
        <canvas id="mainCanvas"></canvas>
        
        <div id="resultArea" style="display:none; text-align: center;">
            <h3 style="color: #10b981;">Kết quả đoạn Skin</h3>
            <canvas id="cropCanvas"></canvas>
        </div>
    </div>

    <div class="sidebar-right">
        <h3>Kho Ảnh Hệ Thống</h3>
        <input type="text" id="searchInput" class="search-box" placeholder="Tìm tên tướng (ví dụ: sin)..." oninput="renderKhoAnh()">
        
        <div class="kho-anh-list" id="khoAnhContainer">
            </div>
    </div>

<script>
    // 1. DANH SÁCH ẢNH (Dựa trên folder 'sines' của bạn trên GitHub)
    const folderPath = "images/sines/";
    const danhSachAnh = [
        "Sinestrea Điệp viên cánh cụt.png",
        "Sinestrea Giấc mộng biển xanh.png",
        "Sinestrea Lữ khách sa mạc.png",
        "Sinestrea Nữ quỷ say ngủ.png",
        "Sinestrea S-Quang vinh.png",
        "Sinestrea Tiểu thư băng giá.png",
        "Sinestrea WaVe.png",
        "Sinestrea Đại tiểu thư.png"
    ];

    const mainCanvas = document.getElementById('mainCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const upload = document.getElementById('upload');
    const khoAnhContainer = document.getElementById('khoAnhContainer');
    const btnDownload = document.getElementById('btn-download');
    const resultArea = document.getElementById('resultArea');

    let originalImg = new Image();

    // 2. HÀM HIỂN THỊ KHO ẢNH (Đây là phần fix lỗi mất ảnh)
    function renderKhoAnh() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        khoAnhContainer.innerHTML = ""; // Xóa để vẽ lại

        danhSachAnh.forEach(fileName => {
            if (fileName.toLowerCase().includes(filter)) {
                const img = document.createElement('img');
                // Quan trọng: dùng encodeURIComponent để xử lý dấu tiếng Việt và khoảng trắng
                img.src = folderPath + encodeURIComponent(fileName);
                img.className = "thumb-item";
                img.title = fileName;
                img.onclick = () => loadImgToCrop(img.src);
                khoAnhContainer.appendChild(img);
            }
        });
    }

    // Nạp ảnh khi click vào kho ảnh
    function loadImgToCrop(src) {
        originalImg.src = src;
    }

    // 3. XỬ LÝ KHI TẢI FILE LÊN
    upload.addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (event) => { originalImg.src = event.target.result; };
        reader.readAsDataURL(e.target.files[0]);
    });

    originalImg.onload = function() {
        drawMain();
        resultArea.style.display = 'none';
        btnDownload.style.display = 'none';
    };

    function drawMain() {
        const ctx = mainCanvas.getContext('2d');
        mainCanvas.width = originalImg.width;
        mainCanvas.height = originalImg.height;
        ctx.drawImage(originalImg, 0, 0);
    }

    // 4. HÀM CẮT ẢNH
    function processCrop() {
        if (!originalImg.src) return alert("Vui lòng chọn ảnh!");

        const x = parseInt(document.getElementById('x').value);
        const y = parseInt(document.getElementById('y').value);
        const w = parseInt(document.getElementById('w').value);
        const h = parseInt(document.getElementById('h').value);

        // Vẽ lại ảnh gốc + khung đỏ chỉ định vùng cắt
        drawMain();
        const mainCtx = mainCanvas.getContext('2d');
        mainCtx.strokeStyle = "red";
        mainCtx.lineWidth = 10;
        mainCtx.strokeRect(x, y, w, h);

        // Thực hiện cắt vào canvas nhỏ
        const cropCtx = cropCanvas.getContext('2d');
        cropCanvas.width = w;
        cropCanvas.height = h;
        cropCtx.drawImage(originalImg, x, y, w, h, 0, 0, w, h);

        // Hiển thị kết quả
        resultArea.style.display = 'block';
        btnDownload.style.display = 'block';
        
        // ĐẢM BẢO KHO ẢNH KHÔNG BỊ MẤT
        // (Không cần gọi lại render vì ta không làm mới trang)
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'skin_da_cat.png';
        link.href = cropCanvas.toDataURL();
        link.click();
    }

    // Chạy nạp kho ảnh ngay khi mở web
    renderKhoAnh();
</script>
</body>
</html>
